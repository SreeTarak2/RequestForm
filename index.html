<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Request</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="login-container">
    <div class="header">
      <h2>Login Request</h2>
      <p class="header-subtitle">Enter your details to request an outing</p>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120">
        <path fill="#242629" fill-opacity="1"
          d="M0,64L60,80C120,96,240,128,360,128C480,128,600,96,720,80C840,64,960,64,1080,69.3C1200,75,1320,85,1380,90.7L1440,96L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z">
        </path>
      </svg>
    </div>

    <div class="form-content">
      <form id="loginForm">
        <div class="input-group">
          <label for="rollno">Roll Number</label>
          <input type="text" id="rollno" name="RollNo" placeholder="Enter your roll number" required />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="off"
            required />
          <i class="fas fa-eye" id="toggle-password"></i>
        </div>

        <div class="input-group">
          <label>Outing Type</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="outingType" value="H" />
              <span class="radio-circle"></span>
              <span class="radio-label">Home</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="outingType" value="L" />
              <span class="radio-circle"></span>
              <span class="radio-label">Local</span>
            </label>
          </div>
        </div>

        <div class="date-time-input">
          <label for="time">Expected Return Time</label>
          <input type="datetime-local" name="time" id="time" required />
        </div>
        <button type="submit">Submit Request</button>
      </form>
    </div>
  </div>
  <div class="screenshot-container" id="screenshot-container">
    <!-- image will be dynamically added -->
  </div>
  <script src="script.js"></script>
</body>

</html>
